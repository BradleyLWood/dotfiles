onboarding = false

[theme]
name = "catppuccin"
auto_switch = false

[theme.custom]
accent = "green"
surface0 = "#24273a"
surface1 = "blue"
overlay0 = "white"
overlay1 = "red"
text = "green"
subtext0 = "white"

[terminal]

[update]

[keys]
# Prefix key to enter prefix mode (default: "ctrl+b")
# Examples: "ctrl+b", "f12", "esc", "-"
# Action bindings use explicit syntax: "prefix+n" requires the prefix;
# "ctrl+alt+n" is a direct terminal-mode shortcut.
# Accepted key syntax: plain keys, ctrl/shift/alt/cmd/super modifiers, and special keys like enter/tab/esc/left/right/up/down.
# Named punctuation such as minus, comma, ampersand, plus, and backtick is also accepted.
# Most reliable direct bindings are ctrl+letter, function keys, and explicit modified chords.
# alt+..., cmd/super, and punctuation-with-modifiers may depend on your terminal/tmux setup.
prefix = "ctrl+space"

# Prefix-mode actions
# help = "prefix+?"
settings = ""
detach = "prefix+d"
# reload_config = "prefix+shift+r"
# open_notification_target = "prefix+o"
# workspace_picker = "prefix+w"
# goto = "alt+f"
# new_workspace = "prefix+shift+n"
# new_worktree = "prefix+shift+g"
# open_worktree = ""    # optional, unset by default
# remove_worktree = ""  # optional, unset by default; opens confirmation
# rename_workspace = "prefix+shift+w"
close_workspace = "prefix+ctrl+shift+x"
previous_workspace = "prefix+ctrl+p" # optional, unset by default
next_workspace = "prefix+ctrl+n"     # optional, unset by default
# previous_agent = ""     # optional, unset by default
# next_agent = ""         # optional, unset by default
# focus_agent = ""        # optional indexed binding, e.g. "prefix+alt+1..9"
# remote_image_paste = "ctrl+v" # only active in herdr --remote; empty disables raw-key image paste
# new_tab = "prefix+c"
# rename_tab = "prefix+shift+t"
# previous_tab = "prefix+p"
# next_tab = "prefix+n"
# switch_tab = "prefix+1..9"
# switch_workspace = ""   # optional indexed binding, e.g. "prefix+shift+1..9"
close_tab = "prefix+ctrl+x"
# rename_pane = "prefix+shift+p"
# edit_scrollback = "prefix+e"
# focus_pane_left = "prefix+h"
# focus_pane_down = "prefix+j"
# focus_pane_up = "prefix+k"
# focus_pane_right = "prefix+l"
# cycle_pane_next = "prefix+tab"
# cycle_pane_previous = "prefix+shift+tab"
# last_pane = ""          # optional, unset by default; bind e.g. "prefix+tab" for global back-and-forth
split_vertical = "prefix+s"
split_horizontal = "prefix+shift+s"
close_pane = "prefix+x"
zoom = "prefix+f"       # legacy alias: fullscreen
# resize_mode = "prefix+r"
toggle_sidebar = "prefix+a"

navigate_workspace_up = "p"
navigate_workspace_down = "n"
navigate_pane_left = "l"      # left arrow always focuses the pane to the left
navigate_pane_down = "k"
navigate_pane_up = "j"
navigate_pane_right = "h"     # right arrow always focuses the pane to the right

[[keys.command]]
key = "prefix+ctrl+g"
type = "popup"
command = "lazygit"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+ctrl+c"
type = "popup"
command = "lazygit --git-dir=$HOME/.dotfiles --work-tree=$HOME"
width = "80%"
height = "80%"

[[keys.command]]
key = "alt+f"
type = "popup"
command = "$HOME/.config/herdr/zoxide-tab.sh"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+y"
type = "popup"
command = "yazi"
width = "80%"
height = "80%"

[ui]
sidebar_start_collapsed = true
sidebar_collapsed_mode = "hidden"
right_click_passthrough_modifier = "ctrl"
confirm_close = true
prompt_new_tab_name = false
prompt_new_workspace_name = true
pane_borders = true
# TODO why is this not working
#pane_scrollbars = false
pane_gaps = false
hide_tab_bar_when_single_tab = true

[ui.sidebar.agents]
row_gap = 1
rows = [["state_icon", "workspace", "tab"], ["agent"]]

[ui.sidebar.spaces]
row_gap = 1
rows = [["state_icon", "workspace"], ["branch", "git_status"]]

[ui.toast]
delivery = "herdr"

[ui.toast.herdr]
position = "bottom-right"

[ui.toast.clipboard]
enabled = true
position = "bottom-center"

[ui.sound]
enabled = false

[session]
# resume_agents_on_restore = true

[remote]
# Whether herdr manages the ssh config used for `herdr --remote`.
# When true (default), herdr runs remote ssh through a generated config that
# includes your ~/.ssh/config first and adds ServerAliveInterval/
# ServerAliveCountMax as fallbacks (so any keepalive values you set yourself
# still win) to survive idle network/NAT timeouts. Herdr also uses a private
# per-attach OpenSSH control socket to reuse the first authenticated connection.
# Set false to run plain ssh against your ssh config unchanged — this does not
# force keepalive or multiplexing off, it only stops herdr from adding its own.
# manage_ssh_config = true

[experimental]
allow_nested = false
kitty_graphics = false
pane_history = false

[advanced]
# Maximum scrollback buffer size in bytes retained per pane terminal.
# Matches Ghostty's default scrollback-limit behavior.
# scrollback_limit_bytes = 10000000

