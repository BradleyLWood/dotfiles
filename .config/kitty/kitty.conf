# vim:fileencoding=utf-8:foldmethod=marker

#: Fonts {{{

font_family        FiraCode Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 14.0

disable_ligatures cursor

modify_font underline_position -2
modify_font underline_thickness 150%
modify_font strikethrough_thickness 150%
modify_font strikethrough_position 2px

undercurl_style thin-sparse

#: }}}

#: Text cursor customization {{{

cursor_shape_unfocused hollow
cursor_blink_interval -1
cursor_trail 100

#: }}}

#: Scrollback {{{

scrollback_lines 10000
scrollbar never
pixel_scroll yes
progress_bar top
wheel_scroll_multiplier 5.0
touch_scroll_multiplier 8.0
momentum_scroll 0.96

#: }}}

#: Mouse {{{

copy_on_select
strip_trailing_spaces never

#: }}}

#: Terminal bell {{{

enable_audio_bell no
visual_bell_duration 0.25
visual_bell_color #45475a

#: }}}

#: Window layout {{{

window_resize_step_cells 5
window_resize_step_lines 5
window_border_width 2px
window_margin_width 0
single_window_margin_width -1
window_padding_width 0
single_window_padding_width -1
inactive_text_alpha 0.3

confirm_os_window_close -1

#: }}}

#: Tab bar {{{

tab_bar_edge top

#tab_bar_style hidden
tab_bar_style powerline
tab_fade 0.25 0.5 0.75 1
tab_powerline_style slanted
tab_separator " "
tab_bar_align left

tab_title_max_length 10
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{tab.last_focused_progress_percent}{index} {title}"

#: }}}

#: Color scheme {{{

# BEGIN_KITTY_THEME
# Catppuccin Kitty Mocha
include current-theme.conf
# END_KITTY_THEME

background_opacity 0.8

#: }}}

#: Advanced {{{

allow_remote_control yes
listen_on unix:/tmp/mykitty
notify_on_cmd_finish invisible 30
close_on_child_death yes

#: }}}

#: OS specific tweaks {{{

wayland_titlebar_color background

#: }}}

#: Keyboard shortcuts {{{

map_timeout 10.0

#: Scrolling {{{

map kitty_mod+up scroll_line_up smooth
map --allow-fallback=shifted,ascii ctrl+shift+k scroll_line_up smooth

map kitty_mod+down scroll_line_down smooth
map --allow-fallback=shifted,ascii ctrl+shift+j scroll_line_down smooth

map kitty_mod+home scroll_home
map kitty_mod+end scroll_end

#: }}}

#: Window management {{{

map ctrl+enter launch --cwd=current
map ctrl+shift+enter new_window

map ctrl+space>d close_window

map ctrl+space>w>s launch --location=vsplit --cwd=current
map ctrl+space>w>shift+s launch --location=hsplit --cwd=current

map ctrl+space>w>h neighboring_window left
map ctrl+space>w>j neighboring_window down
map ctrl+space>w>k neighboring_window up
map ctrl+space>w>l neighboring_window right

map --allow-fallback=shifted,ascii ctrl+space>ctrl+h move_window left
map --allow-fallback=shifted,ascii ctrl+space>ctrl+j move_window down
map --allow-fallback=shifted,ascii ctrl+space>ctrl+k move_window up
map --allow-fallback=shifted,ascii ctrl+space>ctrl+l move_window right

map --new-mode resize --timeout=3.0 ctrl+space>r
map --mode resize esc pop_keyboard_mode
map --mode resize enter pop_keyboard_mode
map --mode resize = resize_window reset
map --mode resize h resize_window narrower
map --mode resize l resize_window wider
map --mode resize k resize_window taller
map --mode resize j resize_window shorter

map kitty_mod+f7 focus_visible_window
map kitty_mod+f8 swap_with_window

#: }}}

#: Tab management {{{

map ctrl+space>n next_tab
map ctrl+space>p previous_tab

map ctrl+space>c new_tab
map ctrl+space>shift+d close_tab

map ctrl+space>y launch --type=overlay-main --cwd=current yazi

map --allow-fallback=shifted,ascii ctrl+space>i set_tab_title

#: }}}

#: Session management {{{
#map alt+f launch --type=overlay --cwd=current ~/.config/kitty/zoxide-tab.sh
map ctrl+shift+s save_as_session

#: }}}

#: Layout management {{{

enabled_layouts splits, stack

map ctrl+space>w>m toggle_layout stack

#: }}}

#: Font sizes {{{

map kitty_mod+equal change_font_size all +2.0
map kitty_mod+plus change_font_size all +2.0
map kitty_mod+kp_add change_font_size all +2.0
map kitty_mod+minus change_font_size all -2.0
map kitty_mod+kp_subtract change_font_size all -2.0
map kitty_mod+0 change_font_size all 0
map kitty_mod+9 change_font_size all 25.0

#: }}}

#: Select and act on visible text {{{

map --allow-fallback=shifted,ascii kitty_mod+e open_url_with_hints
map --allow-fallback=shifted,ascii kitty_mod+p>f kitten hints --type path --program -
map --allow-fallback=shifted,ascii kitty_mod+p>shift+f kitten hints --type path
map --allow-fallback=shifted,ascii kitty_mod+p>c kitten choose-files
map --allow-fallback=shifted,ascii kitty_mod+p>d kitten choose-files --mode=dir
map --allow-fallback=shifted,ascii kitty_mod+p>l kitten hints --type line --program -
map --allow-fallback=shifted,ascii kitty_mod+p>w kitten hints --type word --program -
map --allow-fallback=shifted,ascii kitty_mod+p>h kitten hints --type hash --program -
map --allow-fallback=shifted,ascii kitty_mod+p>y kitten hints --type hyperlink

#: }}}

#: Miscellaneous {{{

map kitty_mod+o command_palette

map --allow-fallback=shifted,ascii kitty_mod+u kitten unicode_input

map kitty_mod+escape kitty_shell window

map kitty_mod+, load_config_file

#: }}}

#: }}}

